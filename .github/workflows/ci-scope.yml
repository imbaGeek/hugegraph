name: CI scope

on:
  workflow_call:
    inputs:
      scope:
        required: true
        type: string
    outputs:
      run:
        value: ${{ jobs.changes.outputs.run }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      # No checkout or execution of PR code. Inspect the complete PR, including renamed paths.
      - uses: actions/github-script@v7
        id: paths
        env:
          CI_SCOPE: ${{ inputs.scope }}
        with:
          script: |
            const scope = process.env.CI_SCOPE;
            const modules = {
              commons: ['hugegraph-commons/'],
              server: ['hugegraph-commons/', 'hugegraph-struct/', 'hugegraph-pd/',
                       'hugegraph-store/', 'hugegraph-server/'],
              distributed: ['hugegraph-commons/', 'hugegraph-struct/', 'hugegraph-pd/',
                            'hugegraph-store/', 'hugegraph-server/'],
              cluster: ['hugegraph-commons/', 'hugegraph-struct/', 'hugegraph-pd/',
                        'hugegraph-store/', 'hugegraph-server/', 'hugegraph-cluster-test/'],
              docker: ['hugegraph-commons/', 'hugegraph-struct/', 'hugegraph-pd/',
                       'hugegraph-store/', 'hugegraph-server/', 'hugegraph-cluster-test/',
                       'docker/', 'install-dist/'],
              dependencies: []
            };
            const relevant = path => {
              // Only known documentation locations; src resources and license inventories count.
              if (path.startsWith('.serena/') || path.startsWith('docs/') ||
                  path === '.github/PULL_REQUEST_TEMPLATE.md' ||
                  (/\.(md|rst)$/i.test(path) && !path.includes('/src/'))) return false;
              // Shared build inputs and CI changes conservatively exercise every scope.
              if (path.endsWith('pom.xml') || path.startsWith('.github/') ||
                  path.startsWith('.mvn/') || path.startsWith('style/') ||
                  ['.editorconfig', '.dockerignore', 'mvnw', 'mvnw.cmd'].includes(path)) return true;
              if (scope === 'dependencies') {
                return path.startsWith('install-dist/') || /\.(jar|gradle|kts)$/.test(path);
              }
              const knownModules = modules.docker.filter(prefix => prefix.startsWith('hugegraph-'));
              return modules[scope].some(prefix => path.startsWith(prefix)) ||
                !knownModules.some(prefix => path.startsWith(prefix));
            };
            let run = true;
            try {
              if (!(scope in modules)) throw new Error('Unknown CI scope: ' + scope);
              if (context.eventName === 'pull_request') {
                const pr = context.payload.pull_request;
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  ...context.repo, pull_number: pr.number, per_page: 100
                });
                // The API caps at 3000 files. An incomplete or stale result must not skip tests.
                const { data: current } = await github.rest.pulls.get({
                  ...context.repo, pull_number: pr.number
                });
                if (files.length === current.changed_files && files.length < 3000 &&
                    current.head.sha === pr.head.sha) {
                  run = files.some(file => relevant(file.filename) ||
                    (file.previous_filename && relevant(file.previous_filename)));
                }
              }
            } catch (error) {
              core.warning('Cannot safely filter changes; running CI: ' + error.message);
            }
            core.setOutput('run', String(run));
